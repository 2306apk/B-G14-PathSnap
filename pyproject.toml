[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathsnap-team-project"
version = "0.1.0"
description = "Student-built map matching and route reconstruction"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["pathsnap*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
