[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pathsnap"
version = "0.1.0"
description = "Trip-local map matching pipeline for the PathSnap hackathon"
requires-python = ">=3.11"
dependencies = [
  "folium>=0.20",
  "joblib>=1.4",
  "matplotlib>=3.9",
  "networkx>=3.4",
  "numpy>=2.0",
  "optuna>=4.0",
  "pandas>=2.2",
  "pyarrow>=18.0",
  "pyproj>=3.7",
  "scikit-learn>=1.6",
  "scipy>=1.14",
  "seaborn>=0.13",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["jupyter>=1.1", "pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
